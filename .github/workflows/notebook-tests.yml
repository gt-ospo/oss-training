name: Notebook Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  notebook-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install notebook test dependencies
        run: python -m pip install -r requirements-notebook-tests.txt

      - name: Execute notebook lessons
        run: python scripts/run_notebook_tests.py